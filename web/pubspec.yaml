name: web_admin
description: "PRM393 Final Web Admin (Flutter Web on Firebase Hosting)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../packages/core
  provider: 6.1.5+1
  go_router: 18.1.1
  intl: 0.20.3
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  google_sign_in: ^6.2.2
  file_picker: ^10.3.3
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exematching_logo.png

