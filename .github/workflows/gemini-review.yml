# AI code review for PRM393 Lab 3 with Gemini.
#
# .github/scripts/gemini_review.py sends the pull request's source diff to
# Gemini in one API request and posts the findings as a review with inline
# comments. The agentic run-gemini-cli action was tried first (runs #1-#5) but
# needs one request per step and its gemini-3.8-flash free tier allows only
# 20 requests/day, so it never finished a review of this pull request.
#
# Needs the repository secret GEMINI_API_KEY (free key from Google AI Studio).
name: '🔎 Gemini Review'

on:
  pull_request:
    types:
      - 'opened'
      - 'reopened'
      - 'ready_for_review'
      # A push re-reviews only when its head commit message contains
      # "[gemini-review]"; the script checks this and exits otherwise.
      - 'synchronize'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: 'read'
      pull-requests: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6
        with:
          persist-credentials: 'false'

      - name: 'Run Gemini review'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GITHUB_TOKEN: '${{ github.token }}'
          GITHUB_REPOSITORY: '${{ github.repository }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          EVENT_ACTION: '${{ github.event.action }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          GEMINI_MODEL: 'gemini-3.5-flash-lite'
        run: python3 .github/scripts/gemini_review.py
